name: Update blog posts
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-blog-posts.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain blog-posts.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add blog-posts.json
            git commit -m "chore: update blog posts"
            git push
          fi
